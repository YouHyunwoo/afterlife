<!doctype html>

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-{{SCRIPT_HASH}}'; img-src 'self' file: https: http: data:; base-uri 'none'; form-action 'none'">
<title>{{TITLE}} · 프로젝트 진행</title>
<style>
:root{color-scheme:light;--ink:#23332e;--muted:#626f68;--line:#dce4db;--paper:#fffefb;--accent:#17664d;--wash:#edf3ec}
*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:var(--ink);font:16px/1.75 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}a{color:var(--accent);text-underline-offset:3px}button,summary,a{touch-action:manipulation}a:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid #c47725;outline-offset:4px}header{padding:44px max(24px,calc((100vw - 1280px)/2));background:var(--ink);color:#fffefb}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#c8dccb}h1{font-size:clamp(24px,3vw,38px);line-height:1.4;margin:10px 0 22px;overflow-wrap:anywhere}.overview{display:grid;grid-template-columns:1fr 2fr;gap:20px}.overview p{margin:4px 0}.label{display:block;font-size:12px;color:#bdd2c2}.updated{margin-top:20px;font-size:12px;color:#bdd2c2}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);gap:36px;max-width:1328px;margin:auto;padding:32px 24px}nav{position:sticky;top:20px;align-self:start}nav h2{font-size:12px;color:var(--muted);letter-spacing:.1em;margin:0 0 12px}nav a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--muted);padding:8px;border-radius:7px;font-size:13px}nav a span{font-size:11px;min-width:30px}nav a:hover,nav a[aria-current]{background:#e0eadf;color:var(--accent);font-weight:650}main{min-width:0}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:12px;color:var(--muted)}button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}.stage{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;scroll-margin-top:20px}.stage[open]{border-color:#9bbba4;box-shadow:0 6px 20px #23332e06}summary{cursor:pointer}.stage>summary{display:flex;align-items:center;gap:14px;padding:20px;font-weight:650;list-style:none}.stage>summary:after{content:'+';margin-left:2px;color:var(--accent)}.stage[open]>summary:after{content:'−'}.stage-number{font-size:12px;color:var(--accent);min-width:34px}.badge{margin-left:auto;font-size:11px;font-weight:500;background:var(--wash);padding:3px 9px;border-radius:20px;white-space:normal}.stage-body{padding:0 22px 22px}.stage-description{color:var(--muted);margin:0 0 18px;font-size:14px}.artifact{border-top:1px solid var(--line);padding:12px 0;scroll-margin-top:20px}.artifact>summary{font-weight:600;overflow-wrap:anywhere}.artifact small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-left:18px}.markdown{max-width:850px;overflow-wrap:anywhere;padding:12px 4px}.markdown h3,.markdown h4,.markdown h5,.markdown h6{line-height:1.5;scroll-margin-top:20px}.markdown h3{font-size:23px}.markdown h4{font-size:19px}.markdown h5,.markdown h6{font-size:16px}.markdown p{margin:12px 0}.markdown ul,.markdown ol{padding-left:25px}.markdown li+li{margin-top:5px}.markdown pre{padding:16px;background:#f0f2ee;border-radius:6px;overflow:auto;font-size:13px}.markdown code{background:#edf0e9;padding:2px 4px;border-radius:3px}.markdown pre code{padding:0}.markdown table{display:block;max-width:100%;overflow:auto;border-collapse:collapse;font-size:14px;margin:16px 0}.markdown th,.markdown td{padding:9px 13px;border:1px solid var(--line);min-width:90px;text-align:left}.markdown th{background:var(--wash)}.markdown img{max-width:100%;height:auto}.markdown blockquote{border-left:3px solid #9bbba4;padding-left:16px;color:var(--muted);margin-left:0}.source{font-size:12px}.round{font-size:14px;color:var(--accent);margin:24px 0 8px}.warning{padding:12px;background:#fff1d8;border-radius:6px;font-size:13px;overflow-wrap:anywhere}footer{font-size:12px;color:var(--muted);padding:20px 0}.task-list-item{list-style:none}
@media(max-width:760px){header{padding:26px 20px}.overview{grid-template-columns:1fr;gap:12px}.layout{grid-template-columns:1fr;padding:20px 14px;gap:20px}nav{position:static;display:flex;overflow:auto;gap:6px;padding-bottom:8px}nav h2{display:none}nav a{flex-shrink:0;border:1px solid var(--line)}.stage>summary{padding:15px;gap:8px;font-size:14px}.stage-body{padding:0 15px 15px}.badge{max-width:115px}.toolbar{align-items:flex-start;gap:8px}.toolbar>span{max-width:55%}}
@media print{body{background:white;font-size:11pt}header{background:white;color:#000;padding:0 0 20px}.label,.updated,.eyebrow{color:#444}.layout{display:block;padding:0}nav,.toolbar,.source{display:none}.stage{box-shadow:none!important;border:0;border-bottom:1px solid #bbb;border-radius:0}.stage>summary{padding:10px 0}.stage-body{padding:0}.markdown{max-width:none}.markdown table{display:table;font-size:9pt}.markdown pre{white-space:pre-wrap}.stage,.artifact{break-inside:auto}summary{break-after:avoid}a{color:inherit}.badge{border:1px solid #bbb}}
</style>
</head>
<body>
<header><div class="eyebrow">Game design → release / project journal</div><h1>{{TITLE}}</h1><div class="overview"><div><span class="label">현재 단계</span><p>{{CURRENT}}</p></div><div><span class="label">다음 행동</span><p>{{NEXT}}</p></div></div><div class="updated">문서 생성 · {{UPDATED}} · Markdown 원본 기반 / 열람용</div></header>
<div class="layout"><nav aria-label="프로젝트 단계"><h2>PROJECT PATH</h2>{{NAV}}</nav><main><div class="toolbar"><span>기획 정리 ≠ 구현 완료 ≠ 경험 검증 ≠ 출시 준비</span><div><button id="expand" type="button">모두 펼치기</button> <button id="collapse" type="button">모두 접기</button></div></div>{{WARNINGS}}{{SECTIONS}}<footer>현재 단계의 문서를 펼쳐 확인하세요. 변경은 원본 Markdown에 기록한 뒤 이 페이지를 다시 생성합니다.</footer></main></div>
<script>
const allDetails = () => [...document.querySelectorAll('details')];
document.getElementById('expand').addEventListener('click', () => allDetails().forEach(d => d.open = true));
document.getElementById('collapse').addEventListener('click', () => allDetails().forEach(d => d.open = false));
function revealHash() {
  let id; try { id = decodeURIComponent(location.hash.slice(1)); } catch { return; }
  const target = document.getElementById(id); if (!target) return;
  let node = target; while (node) { if (node.tagName === 'DETAILS') node.open = true; node = node.parentElement; }
  target.scrollIntoView({block:'start'});
}
window.addEventListener('hashchange', revealHash);
document.addEventListener('click', e => { const a = e.target.closest('a'); if (a && a.getAttribute('href') === location.hash) revealHash(); });
revealHash();
let printState = [];
window.addEventListener('beforeprint', () => { printState = allDetails().map(d => d.open); allDetails().forEach(d => d.open = true); });
window.addEventListener('afterprint', () => allDetails().forEach((d,i) => d.open = printState[i]));
</script>
</body>
</html>
